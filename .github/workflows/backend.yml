name: backend

# PR: roda os testes sempre (é um check obrigatório da main; com filtro de pasta, um PR só de frontend
#     ficaria esperando um check que nunca roda).
# Push na main: testa e publica na Azure Function, só quando o backend mudou.
on:
  pull_request:
  push:
    branches: [main]
    paths: ["backend/**", ".github/workflows/backend.yml"]
  workflow_dispatch:

concurrency:
  group: backend-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  testes:
    name: testes
    runs-on: ubuntu-latest
    services:
      db:
        image: postgis/postgis:16-3.4
        env:
          POSTGRES_USER: eudr
          POSTGRES_PASSWORD: eudr
          POSTGRES_DB: eudr
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U eudr -d eudr"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgresql+psycopg2://eudr:eudr@localhost:5432/eudr
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt
      - run: pip install -r backend/requirements-dev.txt
      - name: Testes
        run: python -m pytest backend/tests -q
      - name: Toda mudança de modelo veio com migração (alembic check)
        working-directory: backend
        run: alembic upgrade head && alembic check

  deploy:
    name: deploy
    needs: testes
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: production
    concurrency:
      group: deploy-backend
      cancel-in-progress: false
    permissions:
      id-token: write   # login no Azure por OIDC (identidade gerenciada), sem senha guardada
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
      - uses: Azure/functions-action@v1
        with:
          app-name: ${{ vars.AZURE_FUNCTIONAPP_NAME }}
          package: backend
          sku: flexconsumption
          remote-build: true
          respect-funcignore: true
      - name: Smoke test (/health e /health/db, com espera do cold start)
        env:
          API: ${{ vars.VITE_API_URL }}
        run: |
          for i in $(seq 1 12); do
            if curl -fsS -m 30 "$API/health/db" | grep -q '"reachable"'; then
              echo "API e banco respondendo"; exit 0
            fi
            echo "tentativa $i: ainda não respondeu, esperando 15 s"; sleep 15
          done
          echo "::error::A API publicada não respondeu /health/db"; exit 1
